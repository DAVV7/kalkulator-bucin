<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;

      font-family:
        Inter,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 20% 20%,
          #312e81,
          transparent 35%
        ),
        radial-gradient(
          circle at 80% 80%,
          #155e75,
          transparent 35%
        ),
        #020617;

      color: white;
    }

    .blob {
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .35;
      animation: move 8s infinite alternate ease-in-out;
    }

    .blob1 {
      background: #6366f1;
      top: -100px;
      left: -100px;
    }

    .blob2 {
      background: #06b6d4;
      right: -100px;
      bottom: -100px;
      animation-delay: 2s;
    }

    @keyframes move {
      from {
        transform: translate(0, 0);
      }

      to {
        transform: translate(80px, 50px);
      }
    }

    .card {
      width: min(400px, calc(100% - 30px));

      padding: 38px;

      border-radius: 24px;

      background:
        rgba(15, 23, 42, .72);

      border:
        1px solid rgba(255,255,255,.12);

      backdrop-filter: blur(20px);

      box-shadow:
        0 30px 80px rgba(0,0,0,.5);

      animation:
        enter .7s cubic-bezier(.2,.8,.2,1);
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform:
          translateY(30px)
          scale(.94);
      }

      to {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }
    }

    .icon {
      width: 70px;
      height: 70px;

      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 20px;

      background:
        linear-gradient(
          135deg,
          #6366f1,
          #06b6d4
        );

      font-size: 30px;

      box-shadow:
        0 15px 40px
        rgba(99,102,241,.35);

      animation: pulse 3s infinite;
    }

    @keyframes pulse {
      50% {
        transform: scale(1.06);
      }
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 30px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #cbd5e1;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;

      margin-bottom: 18px;

      border-radius: 12px;

      border:
        1px solid
        rgba(255,255,255,.12);

      background:
        rgba(2,6,23,.7);

      color: white;

      outline: none;

      font-size: 15px;

      transition: .2s;
    }

    input:focus {
      border-color: #6366f1;

      box-shadow:
        0 0 0 4px
        rgba(99,102,241,.12);
    }

    button {
      width: 100%;

      padding: 14px;

      border: 0;
      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #6366f1,
          #06b6d4
        );

      color: white;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;

      transition: .2s;
    }

    button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 12px 30px
        rgba(99,102,241,.3);
    }

    button:active {
      transform: scale(.98);
    }

    .error {
      min-height: 20px;

      margin-top: 15px;

      text-align: center;

      color: #fb7185;

      font-size: 13px;
    }

    .shake {
      animation: shake .35s;
    }

    @keyframes shake {
      25% {
        transform: translateX(-8px);
      }

      75% {
        transform: translateX(8px);
      }
    }
  </style>
</head>

<body>

  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

  <div class="card" id="card">

    <div class="icon">
      🔐
    </div>

    <h1>Welcome Back</h1>

    <div class="subtitle">
      Login untuk mengakses aplikasi
    </div>

    <form id="loginForm">

      <label>
        Username
      </label>

      <input
        id="username"
        type="text"
        placeholder="Username"
        autocomplete="username"
        required
      >

      <label>
        Password
      </label>

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button id="button" type="submit">
        Login
      </button>

      <div class="error" id="error"></div>

    </form>

  </div>

<script>
  const form =
    document.getElementById("loginForm");

  const button =
    document.getElementById("button");

  const error =
    document.getElementById("error");

  const card =
    document.getElementById("card");

  form.addEventListener("submit", async (e) => {

    e.preventDefault();

    error.textContent = "";

    button.disabled = true;
    button.textContent = "Memproses...";

    try {

      const response = await fetch(
        "/api/login",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            username:
              document.getElementById(
                "username"
              ).value,

            password:
              document.getElementById(
                "password"
              ).value
          })
        }
      );

      const data =
        await response.json();

      if (!response.ok) {

        throw new Error(
          data.message ||
          "Login gagal"
        );

      }

      button.textContent =
        "Berhasil ✓";

      setTimeout(() => {
        window.location.href = "/app";
      }, 400);

    } catch (err) {

      error.textContent =
        err.message;

      card.classList.remove("shake");

      void card.offsetWidth;

      card.classList.add("shake");

      button.disabled = false;
      button.textContent = "Login";
    }

  });
</script>

</body>
</html>
